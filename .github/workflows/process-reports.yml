name: process-reports

# 수집(daily-pipeline)이 끝나면 이어서 요약 -> 산업 태깅 -> 주간 산업 브리핑 -> 다이제스트를 만든다.
# LLM은 Claude Code CLI를 로그인 토큰으로 호출한다:
#   로컬에서 `claude setup-token` 실행 -> 출력된 토큰을 저장소 Secret `CLAUDE_CODE_OAUTH_TOKEN`에 등록.
# 모델을 고정하려면 저장소 Variable `CLAUDE_MODEL`에 모델 이름을 넣는다 (비우면 계정 기본값).

on:
  workflow_run:
    workflows: [daily-pipeline]
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 요약하거나 인사이트를 백필할 최대 리포트 수"
        required: false
        default: "100"
      backfill_insights:
        description: "기존 요약·태그를 유지하고 누락된 개별 리포트 인사이트만 백필"
        type: boolean
        required: false
        default: false
      redo_date:
        description: "브리핑/다이제스트를 강제로 재생성할 발행일 (YYYY-MM-DD, 쉼표로 여러 개, 기간은 2026-09-21~2026-10-16)"
        required: false
        default: ""
      retag:
        description: "분류 체계(config/taxonomy.json) 변경 후 전체 재태깅 + 전체 브리핑/다이제스트 재생성"
        type: boolean
        required: false
        default: false
      redo_all:
        description: "재태깅 없이 테마 병합 + 전체 브리핑/주간 인사이트/다이제스트 재생성 (프롬프트·형식 변경 후)"
        type: boolean
        required: false
        default: false
      digest_only:
        description: "브리핑·주간 인사이트는 건너뛰고 일간 다이제스트만 만든다 (redo_date가 있으면 그 날짜만)"
        type: boolean
        required: false
        default: false
      drain:
        description: "대기열 비우기: 요약만 하고, 남으면 이 워크플로를 다시 실행해 이어 간다. 다 비우면 전체 브리핑/다이제스트를 한 번 다시 만든다"
        type: boolean
        required: false
        default: false
      drain_round:
        description: "(자동) 대기열 비우기 몇 번째 실행인지"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write  # 대기열 비우기에서 이 워크플로를 다시 실행

concurrency:
  # daily-pipeline과 같은 그룹: data/ 에 쓰는 워크플로가 동시에 push 하지 않도록 직렬화
  group: repo-data-writes
  cancel-in-progress: false

jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run은 트리거 시점 커밋을 받으므로, 수집 커밋이 포함된 최신 기본 브랜치를 명시
          ref: ${{ github.event.repository.default_branch }}

      # 원문 텍스트 (scripts/textstore.py). main과 히스토리를 공유하지 않는 별도 브랜치
      - uses: actions/checkout@v4
        with:
          ref: raw-text
          path: raw-text

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Summarize / tag / brief / digest
        id: process
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          # Claude 동시 호출 수 (비우면 3). 시간만 줄고 사용량은 같다
          LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY }}
          # 하루 한 번 수집이라 그날 물량(평일 60~70건)을 한 번에 요약한다
          LIMIT: ${{ github.event.inputs.limit || '100' }}
          BACKFILL_INSIGHTS: ${{ github.event.inputs.backfill_insights }}
          REDO_DATE: ${{ github.event.inputs.redo_date }}
          RETAG: ${{ github.event.inputs.retag }}
          REDO_ALL: ${{ github.event.inputs.redo_all }}
          DRAIN: ${{ github.event.inputs.drain }}
          DIGEST_ONLY: ${{ github.event.inputs.digest_only }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN 이 없습니다. 'claude setup-token'으로 발급해 등록하세요."
            exit 1
          fi
          # 복사 중 섞인 공백/개행/따옴표 제거 후, 값은 노출하지 않고 형식만 점검
          raw_len=${#CLAUDE_CODE_OAUTH_TOKEN}
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d "[:space:]\"'")"
          export CLAUDE_CODE_OAUTH_TOKEN
          echo "token: 길이 ${raw_len} -> 정리 후 ${#CLAUDE_CODE_OAUTH_TOKEN}"
          if [[ "$CLAUDE_CODE_OAUTH_TOKEN" != sk-ant-oat01-* ]]; then
            echo "::error::토큰이 'sk-ant-oat01-'로 시작하지 않습니다. 'claude setup-token' 출력값을 넣어야 합니다 (credentials.json의 accessToken이나 API 키가 아님)."
            exit 1
          fi
          args=(--limit "$LIMIT")
          if [ "$BACKFILL_INSIGHTS" = "true" ]; then
            args+=(--backfill-insights)
          fi
          if [ -n "$REDO_DATE" ]; then
            args+=(--redo-date "$REDO_DATE")
          fi
          if [ "$RETAG" = "true" ]; then
            args+=(--retag)
          fi
          if [ "$REDO_ALL" = "true" ]; then
            args+=(--redo-all)
          fi
          if [ "$DIGEST_ONLY" = "true" ]; then
            args+=(--digest-only)
          fi
          # 수동 실행은 시각과 상관없이 밀린 브리핑·다이제스트를 바로 만든다 (정기 실행은 저녁에 한 번)
          if [ "$DRAIN" = "true" ]; then
            args+=(--no-publish)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--publish-now)
          fi
          args+=(--status-file "$RUNNER_TEMP/status.json")
          # 실패(사용량 한도 등)가 한 건이라도 나면 그때까지의 결과는 커밋하고, 잡은 마지막에 실패로 표시
          set +e
          python scripts/process_reports.py "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit processed data
        run: |
          git config user.name "YUJAEYUN"
          git config user.email "86181002+YUJAEYUN@users.noreply.github.com"
          git add data/ digest/ insights/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore: process research reports $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push

      # 대기열 비우기: 이번에 요약이 진행됐고 대기가 남았으면 다시 실행, 다 비웠으면 전체 재생성 한 번.
      # 같은 동시성 그룹의 대기 중 실행은 새 실행에 밀려 취소되므로, 수집(daily-pipeline)이
      # 대기·실행 중이면 이어 가지 않는다 (그 수집 뒤 요약이 대신 처리하고, 남으면 다시 drain을 돌린다).
      - name: Continue draining
        if: github.event.inputs.drain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
          ROUND: ${{ github.event.inputs.drain_round || '1' }}
        run: |
          status="$RUNNER_TEMP/status.json"
          [ -f "$status" ] || { echo "상태 파일 없음 -> 중단"; exit 0; }
          cat "$status"
          read summarized remaining aborted < <(python -c "import json;d=json.load(open('$status'));print(d['summarized'],d['remaining'],str(d['aborted']).lower())")
          busy=$(gh run list --workflow daily-pipeline.yml --limit 5 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$aborted" = "true" ]; then
            echo "::warning::사용량 한도 등으로 중단 -> 대기 ${remaining}건. 한도가 풀린 뒤 drain을 다시 실행하세요."
          elif [ "$busy" != "0" ]; then
            echo "::notice::수집이 대기·실행 중이라 이어 가지 않음 (대기 ${remaining}건은 수집 뒤 요약에서 처리)"
          elif [ "$remaining" -gt 0 ] && [ "$summarized" -gt 0 ] && [ "$ROUND" -lt 15 ]; then
            echo "대기 ${remaining}건 -> $((ROUND + 1))번째 실행"
            gh workflow run process-reports.yml --ref "${{ github.event.repository.default_branch }}" \
              -f drain=true -f limit="$LIMIT" -f drain_round="$((ROUND + 1))"
          elif [ "$remaining" -eq 0 ]; then
            echo "대기열 비움 -> 전체 브리핑/주간 인사이트/다이제스트 다시 생성"
            gh workflow run process-reports.yml --ref "${{ github.event.repository.default_branch }}" -f redo_all=true -f limit=0
          else
            echo "::warning::진행이 없거나 반복 상한 도달 -> 대기 ${remaining}건 남기고 멈춤"
          fi

      # 대기열 비우기에서 사용량 한도로 멈춘 건 예상된 상황이라 실패로 표시하지 않는다 (위 단계에서 경고)
      - name: Note rate limit
        if: steps.process.outputs.code == '3'
        run: echo "::warning::Claude 구독 사용량 한도로 멈췄습니다. 처리한 만큼 커밋했고, 남은 리포트는 다음 실행에서 이어서 처리합니다."

      # 사용량 한도(코드 3)는 시간이 지나면 풀리므로 실패로 표시하지 않는다 (위 단계에서 경고)
      - name: Fail if processing aborted
        if: steps.process.outputs.code != '0' && steps.process.outputs.code != '3' && github.event.inputs.drain != 'true'
        run: |
          echo "::error::일부 리포트 처리에 실패했습니다 (원인은 위 Summarize 단계 로그의 '중단:'/'실패:' 줄 참고). 처리된 결과는 커밋됐고, 남은 리포트는 다음 실행에서 이어서 처리합니다."
          exit 1
