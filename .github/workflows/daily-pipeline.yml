name: daily-pipeline

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "최대 조회 페이지 수 (페이지당 10건)"
        required: false
        default: "10"
  schedule:
    # 평일 KST 09:00 / 12:00 / 18:00 (UTC 00/03/09시)
    # 대상 사이트 robots.txt는 Googlebot/Yeti 외 자동화 접근을 Disallow 하고 있다.
    # 정기 실행을 멈추려면 이 schedule 블록을 주석 처리할 것.
    - cron: "0 0,3,9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collect + extract pipeline
        run: python scripts/run_pipeline.py --max-pages "${{ github.event.inputs.max_pages || '10' }}"

      - name: Commit updated data
        run: |
          # 커밋 작성자를 저장소 소유자 계정으로 표시 (GitHub noreply 이메일 = 계정 ID+사용자명)
          git config user.name "YUJAEYUN"
          git config user.email "86181002+YUJAEYUN@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore: collect research reports $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
