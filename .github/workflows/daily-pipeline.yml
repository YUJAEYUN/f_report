name: daily-pipeline

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "최대 조회 페이지 수 (페이지당 10건)"
        required: false
        default: "10"
      since:
        description: "과거분 몰아받기: 이 날짜(YYYY-MM-DD) 이후 리포트를 끝까지 받는다 (비우면 평소처럼 새 것만)"
        required: false
        default: ""
  schedule:
    # 평일 KST 17:47 하루 한 번 (UTC 08:47). 그날 리포트 대부분이 올라온 뒤 받는다.
    # GitHub은 정각에 몰린 예약을 몇 시간씩 미루기도 해서 정각을 피한다.
    # 월요일 실행은 한경 lookback(3일)으로 금요일 저녁 이후분까지 받는다.
    # 소스: 하나증권·미래에셋 원문 사이트, 한경 컨센서스 (config/sources.json에서 켜고 끈다)
    # 세 곳 모두 robots.txt가 검색엔진 외 자동화 접근을 Disallow 하고 있다. 개인용으로 요청 간격을
    # 두고 로그인 없이 공개된 목록·PDF만 받는다. 정기 실행을 멈추려면 이 schedule 블록을 주석 처리할 것.
    - cron: "47 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: repo-data-writes  # process-reports와 공유: data/ push 직렬화
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 평소 20분 안팎, 과거분 몰아받기(since)는 더 걸린다
    steps:
      - uses: actions/checkout@v4

      # 원문 텍스트 (scripts/textstore.py). main과 히스토리를 공유하지 않는 별도 브랜치
      - uses: actions/checkout@v4
        with:
          ref: raw-text
          path: raw-text

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collect + extract pipeline
        env:
          SINCE: ${{ github.event.inputs.since }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '10' }}
        run: |
          args=(--max-pages "$MAX_PAGES")
          if [ -n "$SINCE" ]; then
            args+=(--since "$SINCE")
          fi
          python scripts/run_pipeline.py "${args[@]}"

      # 원문을 먼저 올린다: main 커밋이 올라가면 process-reports가 바로 원문을 읽기 때문
      - name: Commit raw text
        working-directory: raw-text
        run: |
          git config user.name "YUJAEYUN"
          git config user.email "86181002+YUJAEYUN@users.noreply.github.com"
          git add text/
          if git diff --cached --quiet; then
            echo "새 원문 없음"
            exit 0
          fi
          git commit -m "chore: raw text $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push

      - name: Commit updated data
        run: |
          # 커밋 작성자를 저장소 소유자 계정으로 표시 (GitHub noreply 이메일 = 계정 ID+사용자명)
          git config user.name "YUJAEYUN"
          git config user.email "86181002+YUJAEYUN@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore: collect research reports $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
