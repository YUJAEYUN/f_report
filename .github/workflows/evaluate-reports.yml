name: evaluate-reports
# 웹 대시보드가 실행 목록에서 리포트별 진행 상태를 찾을 수 있도록 report_ids를 실행 이름에 넣는다.
run-name: "evaluate-reports ${{ inputs.report_ids || inputs.date }}"

# 개별 리포트의 논리를 평가해 data/reports/**.json 의 claim_review 에 붙인다.
# 자동 실행은 하지 않는다: 대시보드의 "AI 평가 생성/다시 평가" 버튼(또는 수동 실행)으로
# 지정한 리포트만 평가한다.
# 인증은 process-reports와 같은 Secret CLAUDE_CODE_OAUTH_TOKEN을 쓰고,
# 모델은 이 단계에서만 Variable CLAUDE_REVIEW_MODEL(비우면 claude-opus-5-5)을 쓴다.

on:
  workflow_dispatch:
    inputs:
      report_ids:
        description: "평가할 report_id (쉼표 구분). report_ids나 date 중 하나는 필요"
        required: false
        default: ""
      date:
        description: "평가할 발행일 (YYYY-MM-DD, 선택)"
        required: false
        default: ""
      redo:
        description: "이미 평가가 있어도 다시 생성"
        type: boolean
        required: false
        default: false
      limit:
        description: "이번 실행에서 평가할 최대 리포트 수"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  # repo-data-writes 그룹에 넣지 않는다: 그룹당 대기 실행은 1개라, 버튼으로 쌓인 평가가 대기 중인
  # 수집/가공 실행을 취소시킬 수 있다. 대신 리포트별로 직렬화하고 push 충돌은 아래에서 재시도한다.
  group: evaluate-reports-${{ inputs.report_ids || inputs.date }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Evaluate report claims
        id: evaluate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          REPORT_IDS: ${{ github.event.inputs.report_ids }}
          REPORT_DATE: ${{ github.event.inputs.date }}
          REDO: ${{ github.event.inputs.redo }}
          LIMIT: ${{ github.event.inputs.limit || '10' }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN 이 없습니다. 'claude setup-token'으로 발급해 등록하세요."
            exit 1
          fi
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d "[:space:]\"'")"
          export CLAUDE_CODE_OAUTH_TOKEN
          if [[ "$CLAUDE_CODE_OAUTH_TOKEN" != sk-ant-oat01-* ]]; then
            echo "::error::토큰이 'sk-ant-oat01-'로 시작하지 않습니다. 'claude setup-token' 출력값을 넣어야 합니다."
            exit 1
          fi
          if [ -z "$REPORT_IDS" ] && [ -z "$REPORT_DATE" ]; then
            echo "::error::report_ids 또는 date를 지정하세요 (전체 자동 평가는 하지 않습니다)."
            exit 1
          fi
          args=(--limit "$LIMIT")
          if [ -n "$REPORT_IDS" ]; then
            args+=(--ids "$REPORT_IDS")
          fi
          if [ -n "$REPORT_DATE" ]; then
            args+=(--date "$REPORT_DATE")
          fi
          if [ "$REDO" = "true" ]; then
            args+=(--redo)
          fi
          # 일부 실패해도 그때까지의 결과는 커밋하고, 잡은 마지막에 실패로 표시
          set +e
          python scripts/evaluate_reports.py "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit reviews
        run: |
          git config user.name "YUJAEYUN"
          git config user.email "86181002+YUJAEYUN@users.noreply.github.com"
          git add data/reports/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore: evaluate report claims $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          # 다른 워크플로가 먼저 push 했을 수 있으므로 rebase 후 몇 번 재시도
          for i in 1 2 3 4 5; do
            if ! git pull --rebase; then
              git rebase --abort
              echo "::error::평가 커밋이 다른 커밋과 충돌했습니다 (같은 리포트 파일이 동시에 바뀜). 다시 실행하세요."
              exit 1
            fi
            git push && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: Fail if evaluation aborted
        if: steps.evaluate.outputs.code != '0'
        run: |
          echo "::error::일부 리포트 평가에 실패했습니다 (원인은 위 Evaluate 단계 로그의 '중단:'/'실패:' 줄 참고). 처리된 결과는 커밋됐습니다."
          exit 1
